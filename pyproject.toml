[project]
name = "check-digit-format"
version = "0.1.0"
description = "Validating the vehicle identification number (VIN) from the input file"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --junitxml=reports/pytest.xml"

[tool.coverage.run]
source = ["src"]
